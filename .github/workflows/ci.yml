name: ci

on:
    push:
        branches:
            - main
        paths:
            - "wood_microstructure/**"
            - "pyproject.toml"
            - ".github/workflows/ci.yml"
            - ".pre-commit-config.yaml"
            - "examples/**"
    pull_request:

concurrency:
  group: ${{format('{0}:{1}:{2}', github.repository, github.ref, github.workflow)}}
  cancel-in-progress: true

jobs:
    pre-commit:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Cache Python dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: pip-pre-commit-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: pip-pre-commit-

            - name: Set up Python
              uses: actions/setup-python@v3
              with:
                  python-version: "3.13"

            - name: Install Python dependencies
              run: pip install -e .[pre-commit]

            - name: Run pre-commit
              run: pre-commit run --all-files || ( git status --short ; git diff ; exit 1 )

    run:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                python-version: ["3.11", "3.14"]

        steps:
            - uses: actions/checkout@v3

            - name: Cache Python dependencies
              uses: actions/cache@v3
              with:
                  path: ~/.cache/pip
                  key: pip-${{ matrix.python-version }}-tests-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: pip-${{ matrix.python-version }}-tests

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v3
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install Python dependencies
              run: pip install -e .[surrogate,surrogate_train,utils,tests]

            - name: Run tests
              run: pytest -sv --disable-warnings

    test-eessi:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Set up EESSI environment
          uses: eessi/github-action-eessi@v3
          with:
            eessi_stack_version: '2023.06'

        - name: Test building with EESSI
          env:
            SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          run: |
              module load EESSI-extend
              unset EASYBUILD_DEBUG
              eb --logtostdout --software-commit=${SOURCE_SHA} .github/ci.eb --rebuild
